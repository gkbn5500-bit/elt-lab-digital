<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYMM İngilizce Öğretmen Rehberi - 5. Sınıf</title>
    <script src="https://cdn.tailwindcss.com"></script>

            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cream: '#FDFBF7',
                            darkbg: '#0F172A',
                            navy: '#1E3A8A',
                            turquoise: '#0D9488',
                            yellow: '#F59E0B',
                            coral: '#F43F5E',
                            purple: '#8B5CF6'

                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Print Styles */
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
            .print-area { width: 100%; border: none; box-shadow: none; }
            .page-break { page-break-before: always; }
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Card Hover Effects */
        .hover-card { transition: all 0.2s ease; }
        .hover-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-brand-cream text-slate-800 dark:bg-brand-darkbg dark:text-slate-100 min-h-screen flex flex-col">

    <header class="bg-brand-navy text-white shadow-md p-4 sticky top-0 z-50 no-print flex justify-between items-center transition-colors">
        <div class="flex items-center gap-4 cursor-pointer" onclick="navigate('home')">
            <div class="bg-white/20 p-3 rounded-lg">
                <i class="fas fa-book-open text-2xl text-brand-yellow"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight">TYMM İngilizce Öğretmen Rehberi</h1>
                <h2 class="text-sm md:text-md text-brand-turquoise font-semibold">5. Sınıf – 1. Tema: School Life</h2>
            </div>
        </div>
        <div class="flex gap-2 md:gap-4">
            <button onclick="toggleDarkMode()" class="p-3 rounded-full hover:bg-white/20 transition text-xl" title="Karanlık Mod">
                <i id="darkModeIcon" class="fas fa-moon"></i>
            </button>
            <button onclick="toggleFullScreen()" class="p-3 rounded-full hover:bg-white/20 transition text-xl hidden md:block" title="Tam Ekran">
                <i id="fsIcon" class="fas fa-expand"></i>
            </button>
        </div>
    </header>

    <main id="main-content" class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full mb-20">
        
        <!-- ================= HOME SCREEN ================= -->
        <section id="view-home" class="view-section fade-in h-full flex flex-col justify-center">
            <div class="text-center mb-8">
                <p class="text-lg text-slate-500 dark:text-slate-400 italic">“Dersini planla, etkinliğini seç, hemen uygula.”</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
                <!-- Card 1 -->
                <button onclick="navigate('plan')" class="hover-card bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border-t-4 border-brand-turquoise flex flex-col items-center text-center justify-center group h-64">
                    <div class="bg-brand-turquoise/10 text-brand-turquoise p-5 rounded-full mb-4 group-hover:scale-110 transition">
                        <i class="fas fa-map text-5xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">Dersi Planla</h3>
                    <p class="text-slate-600 dark:text-slate-300">Konuyu ve süreyi seç, hazır ders akışını oluştur.</p>
                </button>
                <!-- Card 2 -->
                <button onclick="navigate('activities')" class="hover-card bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border-t-4 border-brand-yellow flex flex-col items-center text-center justify-center group h-64">
                    <div class="bg-brand-yellow/10 text-brand-yellow p-5 rounded-full mb-4 group-hover:scale-110 transition">
                        <i class="fas fa-bolt text-5xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">Hazır Etkinlik Seç</h3>
                    <p class="text-slate-600 dark:text-slate-300">Tek tıkla uygulanabilir sınıf etkinliği bul.</p>
                </button>
                <!-- Card 3 -->
                <button onclick="navigate('assessment')" class="hover-card bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border-t-4 border-brand-purple flex flex-col items-center text-center justify-center group h-64">
                    <div class="bg-brand-purple/10 text-brand-purple p-5 rounded-full mb-4 group-hover:scale-110 transition">
                        <i class="fas fa-clipboard-check text-5xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">Ölç ve Değerlendir</h3>
                    <p class="text-slate-600 dark:text-slate-300">Ders sonunda hızlı öğrenme kanıtı topla.</p>
                </button>
                <!-- Card 4 -->
                <button onclick="navigate('emergency')" class="hover-card bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border-t-4 border-brand-coral flex flex-col items-center text-center justify-center group h-64">
                    <div class="bg-brand-coral/10 text-brand-coral p-5 rounded-full mb-4 group-hover:scale-110 transition">
                        <i class="fas fa-life-ring text-5xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">Acil Ders Fikri</h3>
                    <p class="text-slate-600 dark:text-slate-300">Beklenmeyen sınıf durumlarına anında çözüm bul.</p>
                </button>
            </div>
        </section>

        <!-- ================= SECTION 1: DERSİ PLANLA ================= -->
        <section id="view-plan" class="view-section hidden fade-in">
            <h2 class="text-3xl font-bold mb-6 text-brand-navy dark:text-brand-turquoise border-b-2 pb-2">Dersi Planla</h2>
            
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md no-print mb-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2">Konu:</label>
                        <select id="plan-topic" class="w-full p-4 border rounded-lg text-lg bg-gray-50 dark:bg-slate-700 dark:border-slate-600">
                            <option value="People at School">People at School</option>
                            <option value="Places at School">Places at School</option>
                            <option value="School Rules">School Rules</option>
                            <option value="School Clubs">School Clubs</option>
                            <option value="Countries">Countries</option>
                            <option value="National Days">National Days</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Ders Amacı:</label>
                        <select id="plan-aim" class="w-full p-4 border rounded-lg text-lg bg-gray-50 dark:bg-slate-700 dark:border-slate-600">
                            <option value="Kelime öğretmek">Kelime öğretmek</option>
                            <option value="Dinleme yaptırmak">Dinleme yaptırmak</option>
                            <option value="Konuşturmak">Konuşturmak</option>
                            <option value="Okuma yaptırmak">Okuma yaptırmak</option>
                            <option value="Yazdırmak">Yazdırmak</option>
                            <option value="Pekiştirmek">Pekiştirmek</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Süre:</label>
                        <select id="plan-duration" class="w-full p-4 border rounded-lg text-lg bg-gray-50 dark:bg-slate-700 dark:border-slate-600">
                            <option value="20">20 dakika</option>
                            <option value="30">30 dakika</option>
                            <option value="40" selected>40 dakika</option>
                        </select>
                    </div>
                </div>
                <button onclick="generatePlan()" class="w-full bg-brand-turquoise hover:bg-teal-700 text-white font-bold text-xl py-4 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fas fa-magic"></i> Dersimi Hazırla
                </button>
            </div>

            <!-- Plan Output -->
            <div id="plan-output" class="hidden bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-gray-200 dark:border-slate-700 p-8 print-area">
                <!-- Content injected via JS -->
            </div>
            
            <div id="plan-actions" class="hidden no-print flex flex-wrap gap-4 mt-6 justify-center">
                <button onclick="generatePlan()" class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-white px-6 py-3 rounded-lg font-semibold"><i class="fas fa-redo"></i> Başka Plan Oluştur</button>
                <button onclick="playSound('click'); window.print()" class="bg-brand-navy hover:bg-blue-900 text-white px-6 py-3 rounded-lg font-semibold"><i class="fas fa-print"></i> Yazdır</button>
            </div>
        </section>

        <!-- ================= SECTION 2: HAZIR ETKİNLİK SEÇ ================= -->
        <section id="view-activities" class="view-section hidden fade-in">
            <h2 class="text-3xl font-bold mb-6 text-brand-navy dark:text-brand-yellow border-b-2 pb-2">Hazır Etkinlik Seç</h2>
            
            <!-- Activity Types -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8 no-print">
                <button onclick="loadActivity('Warm-up')" class="act-btn bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-brand-coral hover:bg-gray-50 dark:hover:bg-slate-700 text-lg font-semibold"><i class="fas fa-fire mr-2 text-brand-coral"></i> Warm-up</button>
                <button onclick="loadActivity('Vocabulary')" class="act-btn bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-brand-turquoise hover:bg-gray-50 dark:hover:bg-slate-700 text-lg font-semibold"><i class="fas fa-font mr-2 text-brand-turquoise"></i> Vocabulary</button>
                <button onclick="loadActivity('Listening')" class="act-btn bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-brand-yellow hover:bg-gray-50 dark:hover:bg-slate-700 text-lg font-semibold"><i class="fas fa-ear-listen mr-2 text-brand-yellow"></i> Listening</button>
                <button onclick="loadActivity('Reading')" class="act-btn bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-brand-purple hover:bg-gray-50 dark:hover:bg-slate-700 text-lg font-semibold"><i class="fas fa-book mr-2 text-brand-purple"></i> Reading</button>
                <button onclick="loadActivity('Speaking')" class="act-btn bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-green-500 hover:bg-gray-50 dark:hover:bg-slate-700 text-lg font-semibold"><i class="fas fa-comments mr-2 text-green-500"></i> Speaking</button>
                <button onclick="loadActivity('Writing')" class="act-btn bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-blue-500 hover:bg-gray-50 dark:hover:bg-slate-700 text-lg font-semibold"><i class="fas fa-pen mr-2 text-blue-500"></i> Writing</button>
                <button onclick="loadActivity('Game')" class="act-btn bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-pink-500 hover:bg-gray-50 dark:hover:bg-slate-700 text-lg font-semibold"><i class="fas fa-gamepad mr-2 text-pink-500"></i> Game</button>
                <button onclick="loadActivity('Reflection')" class="act-btn bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-gray-500 hover:bg-gray-50 dark:hover:bg-slate-700 text-lg font-semibold"><i class="fas fa-lightbulb mr-2 text-gray-500"></i> Reflection</button>
            </div>

            <!-- Activity Display Container -->
            <div id="activity-display" class="hidden">
                <!-- Content injected via JS -->
            </div>
            
            <!-- Intro State -->
            <div id="activity-intro" class="text-center py-20 text-slate-400">
                <i class="fas fa-hand-pointer text-6xl mb-4"></i>
                <h3 class="text-2xl">Yukarıdan bir etkinlik türü seçin.</h3>
            </div>
        </section>

        <!-- ================= SECTION 3: ÖLÇ VE DEĞERLENDİR ================= -->
        <section id="view-assessment" class="view-section hidden fade-in">
            <h2 class="text-3xl font-bold mb-6 text-brand-navy dark:text-brand-purple border-b-2 pb-2">Ölç ve Değerlendir</h2>
            
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md no-print mb-6">
                <label class="block text-lg font-semibold mb-3">Kullanım Amacı:</label>
                <select id="assessment-type" onchange="renderAssessment()" class="w-full p-4 border rounded-lg text-lg bg-gray-50 dark:bg-slate-700 dark:border-slate-600">
                    <option value="" disabled selected>Bir araç seçin...</option>
                    <option value="exit">Dersi Kapat (Exit Ticket)</option>
                    <option value="speaking">Speaking Değerlendir</option>
                    <option value="self">Öz Değerlendirme Yap</option>
                    <option value="peer">Akran Değerlendirme Yap</option>
                    <option value="performance">Performans Görevi Ver</option>
                </select>
            </div>

            <div id="assessment-display" class="hidden print-area bg-white dark:bg-slate-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-slate-700">
                <!-- Content injected via JS -->
            </div>
            
            <div id="assessment-actions" class="hidden no-print flex justify-center mt-6">
                <button onclick="playSound('click'); window.print()" class="bg-brand-navy hover:bg-blue-900 text-white px-8 py-3 rounded-lg font-bold text-lg"><i class="fas fa-print mr-2"></i> Yazdır</button>
            </div>
        </section>

        <!-- ================= SECTION 4: ACİL DERS FİKRİ ================= -->
        <section id="view-emergency" class="view-section hidden fade-in">
            <h2 class="text-3xl font-bold mb-6 text-brand-navy dark:text-brand-coral border-b-2 pb-2">Acil Ders Fikri</h2>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 no-print">
                <button onclick="loadEmergency('5 dakika kaldı')" class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow hover:bg-brand-coral hover:text-white transition text-center font-bold">5 dakika kaldı</button>
                <button onclick="loadEmergency('Sınıf çok hareketli')" class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow hover:bg-brand-coral hover:text-white transition text-center font-bold">Sınıf hareketli</button>
                <button onclick="loadEmergency('İnternet yok')" class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow hover:bg-brand-coral hover:text-white transition text-center font-bold">İnternet yok</button>
                <button onclick="loadEmergency('Materyalim yok')" class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow hover:bg-brand-coral hover:text-white transition text-center font-bold">Materyalim yok</button>
            </div>

            <div id="emergency-display" class="hidden">
                 <!-- Content injected via JS -->
            </div>
            
            <div id="emergency-intro" class="text-center py-20 text-slate-400">
                <i class="fas fa-siren-on text-6xl mb-4 text-brand-coral/50"></i>
                <h3 class="text-2xl">Durumu seçin, anında çözüm görün.</h3>
            </div>
        </section>

    </main>

    <!-- ================= BOTTOM TOOLBAR ================= -->
    <footer class="fixed bottom-0 w-full bg-white dark:bg-slate-900 border-t border-gray-200 dark:border-slate-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] no-print z-50">
        <div class="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center h-16">
            
            <!-- Nav Actions -->
            <button onclick="navigate('home')" class="flex flex-col items-center text-brand-navy dark:text-slate-300 hover:text-brand-turquoise transition w-16">
                <i class="fas fa-home text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Ana Sayfa</span>
            </button>
            
            <button onclick="randomActivityOverall()" class="flex flex-col items-center text-brand-navy dark:text-slate-300 hover:text-brand-yellow transition w-16">
                <i class="fas fa-dice text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Rastgele</span>
            </button>
            
            <!-- Timer Controls -->
            <div class="flex items-center bg-gray-100 dark:bg-slate-800 rounded-full px-4 py-1 gap-3">
                <i class="fas fa-stopwatch text-brand-coral"></i>
                <span id="timer-display" class="text-xl font-bold font-mono w-16 text-center">00:00</span>
                <div class="flex gap-1" id="timer-buttons">
                    <button onclick="startTimer(1)" class="bg-white dark:bg-slate-700 px-2 py-1 rounded text-xs font-bold shadow hover:bg-brand-turquoise hover:text-white transition">1m</button>
                    <button onclick="startTimer(3)" class="bg-white dark:bg-slate-700 px-2 py-1 rounded text-xs font-bold shadow hover:bg-brand-turquoise hover:text-white transition">3m</button>

                </div>
                <button id="timer-stop" onclick="stopTimer()" class="hidden bg-brand-coral text-white px-3 py-1 rounded text-xs font-bold shadow hover:bg-red-700 transition">Durdur</button>
            </div>
            
            <!-- Info Icon -->
            <div class="flex flex-col items-center text-slate-400 w-16 cursor-help" title="TYMM Uyumlu İçerik">
                <i class="fas fa-shield-halved text-xl mb-1"></i>
                <span class="text-[10px]">TYMM</span>
            </div>
        </div>
    </footer>

        // ================= CORE FUNCTIONS =================
        
        // --- UI AUDIO ENGINE ---
        let uiAudioCtx = null;
        function playSound(type = 'click') {
            try {
                if (!uiAudioCtx) uiAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (uiAudioCtx.state === 'suspended') uiAudioCtx.resume();
                
                const osc = uiAudioCtx.createOscillator();
                const gain = uiAudioCtx.createGain();
                osc.connect(gain);
                gain.connect(uiAudioCtx.destination);
                
                const now = uiAudioCtx.currentTime;
                
                if (type === 'pop') {
                    // Ana menü kartlarına tıklama sesi (Tok ve yumuşak)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'click') {
                    // Standart butonlar, sekmeler ve temalar için (Kısa tık)
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'action') {
                    // Plan oluşturma gibi büyük eylemler için (Yükselen pozitif ses)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch(e) {
                console.log("Ses çalınamadı", e);
            }
        }

        let timerInterval;

        function startTimer(minutes) {
            playSound('click');
            clearInterval(timerInterval);
            timeLeft = minutes * 60;
            updateTimerDisplay();
            document.getElementById('timer-stop').classList.remove('hidden');
            document.getElementById('timer-buttons').classList.add('hidden');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    stopTimer();
                    playBeep();
                }
            }, 1000);
        }

        function stopTimer() {
            playSound('click');
            clearInterval(timerInterval);
            timeLeft = 0;
            updateTimerDisplay();
            document.getElementById('timer-stop').classList.add('hidden');
            document.getElementById('timer-buttons').classList.remove('hidden');
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            const display = document.getElementById('timer-display');
            display.innerText = `${m}:${s}`;
            if(timeLeft > 0 && timeLeft <= 10) {
                display.classList.add('text-brand-coral', 'animate-pulse');
            } else {
                display.classList.remove('text-brand-coral', 'animate-pulse');
            }
        }

        function playBeep() {
            // Synthesize a gentle beep using Web Audio API (No external sound file needed)
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2); // E5
                
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);
                
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 1);
            } catch(e) {
                console.log("Audio not supported");
            }
        }

                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="border border-green-200 bg-green-50 dark:bg-green-900/20 dark:border-green-800 p-4 rounded-lg">
                            <h5 class="font-bold text-green-700 dark:text-green-400 mb-1"><i class="fas fa-arrow-down w-5"></i> Kolaylaştır (Destek)</h5>
                            <p class="text-sm dark:text-slate-300">${act.simplify}</p>
                        </div>
                        <div class="border border-purple-200 bg-purple-50 dark:bg-purple-900/20 dark:border-purple-800 p-4 rounded-lg">
                            <h5 class="font-bold text-purple-700 dark:text-purple-400 mb-1"><i class="fas fa-arrow-up w-5"></i> Zenginleştir</h5>
                            <p class="text-sm dark:text-slate-300">${act.enrich}</p>
                        </div>
                    </div>

                    <div class="border-t border-gray-200 dark:border-slate-700 pt-4 mt-4">
                        <p class="text-sm text-slate-500 dark:text-slate-400 flex items-start">
                            <i class="fas fa-info-circle mt-1 mr-2 text-brand-turquoise"></i>
                            <span><strong>TYMM Notu:</strong> ${act.tymm}</span>
                        </p>
                    </div>

                    <div class="mt-8 flex justify-end gap-3 no-print">
                        <button onclick="loadActivity('${type}')" class="px-6 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg font-bold transition"><i class="fas fa-random mr-2"></i> Başka ${type}</button>
                    </div>
                </div>
            `;

            document.getElementById('activity-intro').classList.add('hidden');
            document.getElementById('activity-display').innerHTML = html;
            document.getElementById('activity-display').classList.remove('hidden');
        }

        function randomActivityOverall() {
            navigate('activities');
            const types = Object.keys(activityData);
            const randomType = types[Math.floor(Math.random() * types.length)];
            loadActivity(randomType);
        }

        // ================= SECTION 3: ASSESSMENT =================
        function renderAssessment() {
            playSound('click');
            const type = document.getElementById('assessment-type').value;
            const display = document.getElementById('assessment-display');
            document.getElementById('assessment-actions').classList.remove('hidden');
            display.classList.remove('hidden');

            let html = "";

            if (type === "exit") {
                html = `
                    <div class="text-center mb-6">
                        <h3 class="text-2xl font-bold mb-2">Exit Ticket</h3>
                        <p class="text-slate-500">Ders bitiminde öğrencilere bu 3 soruyu tahtaya yansıtın veya küçük kağıtlara yazdırın.</p>
                    </div>
                    <div class="max-w-md mx-auto bg-yellow-50 dark:bg-yellow-900/20 border-2 border-yellow-400 p-8 rounded-xl shadow-inner">
                        <h4 class="text-xl font-bold mb-4 border-b border-yellow-300 pb-2">Before you leave, write:</h4>
                        <ol class="list-decimal pl-5 space-y-4 text-lg">
                            <li><strong>1 school place</strong><br><span class="text-slate-400 text-sm">(e.g., library, lab)</span></li>
                            <li><strong>1 school rule</strong><br><span class="text-slate-400 text-sm">(e.g., Don't run)</span></li>
                            <li><strong>1 school club you like</strong><br><span class="text-slate-400 text-sm">(e.g., I like chess club)</span></li>
                        </ol>
                    </div>
                `;
            } else if (type === "speaking") {
                html = `
                    <h3 class="text-2xl font-bold mb-4">Speaking Checklist</h3>
                    <table class="w-full text-left border-collapse border border-slate-300 dark:border-slate-600">
                        <thead class="bg-slate-100 dark:bg-slate-700">
                            <tr>
                                <th class="p-3 border border-slate-300 dark:border-slate-600">Criteria</th>
                                <th class="p-3 border border-slate-300 dark:border-slate-600 text-center w-24 text-green-600">Yes</th>
                                <th class="p-3 border border-slate-300 dark:border-slate-600 text-center w-24 text-yellow-600">Sometimes</th>
                                <th class="p-3 border border-slate-300 dark:border-slate-600 text-center w-24 text-red-500">Not Yet</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td class="p-3 border border-slate-300 dark:border-slate-600">1. Asked a question clearly</td><td class="border border-slate-300"></td><td class="border border-slate-300"></td><td class="border border-slate-300"></td></tr>
                            <tr><td class="p-3 border border-slate-300 dark:border-slate-600">2. Answered the partner's question</td><td class="border border-slate-300"></td><td class="border border-slate-300"></td><td class="border border-slate-300"></td></tr>
                            <tr><td class="p-3 border border-slate-300 dark:border-slate-600">3. Used target vocabulary (clubs, places)</td><td class="border border-slate-300"></td><td class="border border-slate-300"></td><td class="border border-slate-300"></td></tr>
                            <tr><td class="p-3 border border-slate-300 dark:border-slate-600">4. Maintained eye contact</td><td class="border border-slate-300"></td><td class="border border-slate-300"></td><td class="border border-slate-300"></td></tr>
                        </tbody>
                    </table>
                `;
            } else if (type === "performance") {
                html = `
                    <div class="border-4 border-brand-navy p-8 rounded-xl bg-white dark:bg-slate-800">
                        <div class="text-center mb-6">
                            <span class="bg-brand-coral text-white px-3 py-1 rounded-full text-sm font-bold tracking-widest uppercase mb-2 inline-block">Performans Görevi</span>
                            <h3 class="text-3xl font-bold text-brand-navy dark:text-brand-turquoise">My Fictional International School</h3>
                        </div>
                        
                        <div class="mb-6">
                            <h4 class="font-bold text-lg mb-2 text-brand-purple">Öğrenci Yönergesi (Task):</h4>
                            <p class="bg-slate-50 dark:bg-slate-700 p-4 rounded border-l-4 border-brand-purple italic">"Hayalî bir uluslararası okul hakkında renkli bir poster hazırla. Okulunun bir adı olsun. İçinde hangi bölümler var, hangi kulüpler var ve kurallarınız neler? Çizimler yaparak veya fotoğraflar keserek posterini İngilizce yazılarla süsle."</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <h4 class="font-bold text-lg mb-2"><i class="fas fa-list text-brand-turquoise"></i> Posterde Bulunması Gerekenler:</h4>
                                <ul class="list-disc pl-5 space-y-1">
                                    <li>School name</li>
                                    <li>Important people (Headmaster, teachers)</li>
                                    <li>School places (Library, lab...)</li>
                                    <li>Three school rules</li>
                                    <li>Two school clubs</li>
                                    <li>Pictures or drawings</li>
                                </ul>
                            </div>
                            <div>
                                <h4 class="font-bold text-lg mb-2"><i class="fas fa-quote-left text-brand-yellow"></i> Örnek Cümle Kalıpları:</h4>
                                <ul class="list-none space-y-2">
                                    <li class="bg-gray-100 dark:bg-slate-700 px-2 py-1 rounded text-sm font-mono">This is our school.</li>
                                    <li class="bg-gray-100 dark:bg-slate-700 px-2 py-1 rounded text-sm font-mono">There is a big library.</li>
                                    <li class="bg-gray-100 dark:bg-slate-700 px-2 py-1 rounded text-sm font-mono">You mustn't run in the corridors.</li>
                                    <li class="bg-gray-100 dark:bg-slate-700 px-2 py-1 rounded text-sm font-mono">We have a science club.</li>
                                </ul>
                            </div>
                        </div>

                        <div>
                            <h4 class="font-bold text-lg mb-2">Değerlendirme Rubriği (Mini Rubric):</h4>
                            <table class="w-full text-sm text-left border-collapse border border-slate-300 dark:border-slate-600">
                                <thead class="bg-slate-100 dark:bg-slate-700">
                                    <tr>
                                        <th class="p-2 border border-slate-300">Criteria</th>
                                        <th class="p-2 border border-slate-300">Excellent (4)</th>
                                        <th class="p-2 border border-slate-300">Good (3)</th>
                                        <th class="p-2 border border-slate-300">Developing (2)</th>
                                        <th class="p-2 border border-slate-300">Needs Support (1)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr><td class="p-2 border font-bold">Content</td><td class="p-2 border">All elements present</td><td class="p-2 border">Most elements present</td><td class="p-2 border">Some elements missing</td><td class="p-2 border">Incomplete task</td></tr>
                                    <tr><td class="p-2 border font-bold">Language</td><td class="p-2 border">Accurate sentences</td><td class="p-2 border">Few minor errors</td><td class="p-2 border">Frequent errors</td><td class="p-2 border">Hard to understand</td></tr>
                                    <tr><td class="p-2 border font-bold">Visual Design</td><td class="p-2 border">Creative & neat</td><td class="p-2 border">Neat</td><td class="p-2 border">Messy</td><td class="p-2 border">No visuals</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else {
                html = `<div class="p-8 text-center"><p class="text-xl">Standart değerlendirme formu buraya yüklendi.</p></div>`;
            }

            display.innerHTML = html;
        }

        // ================= SECTION 4: EMERGENCY =================
        function loadEmergency(situation) {
            playSound('click');
            const ideas = emergencyData[situation];
            if(!ideas) return;

            const idea = ideas[Math.floor(Math.random() * ideas.length)];

            const html = `
                <div class="bg-brand-coral text-white p-8 rounded-xl shadow-2xl fade-in relative overflow-hidden">
                    <i class="fas fa-bolt text-9xl absolute -right-4 -bottom-4 opacity-20"></i>
                    <div class="relative z-10">
                        <span class="bg-black/20 px-3 py-1 rounded-full text-sm font-bold uppercase tracking-wider mb-4 inline-block">${situation}</span>
                        <h3 class="text-4xl font-bold mb-2">${idea.name}</h3>
                        <p class="text-coral-100 text-lg mb-6"><i class="fas fa-stopwatch mr-2"></i>Süre: ${idea.duration}</p>
                        
                        <div class="bg-white/10 p-5 rounded-lg backdrop-blur-sm mb-6 border border-white/20">
                            <h4 class="font-bold text-xl mb-2"><i class="fas fa-running mr-2"></i> Nasıl Uygulanır?</h4>
                            <p class="text-lg">${idea.action}</p>
                        </div>
                        
                        <div class="bg-white text-brand-coral p-4 rounded-lg shadow mb-6 font-bold text-xl">
                            <i class="fas fa-comment-dots mr-2 text-slate-400"></i> "${idea.says}"
                        </div>

                        <p class="text-sm opacity-90"><i class="fas fa-lightbulb mr-1 text-yellow-300"></i> <strong>Neden uygun?</strong> ${idea.why}</p>
                    </div>
                    
                    <div class="mt-6 flex justify-end">
                        <button onclick="loadEmergency('${situation}')" class="bg-black/20 hover:bg-black/40 text-white px-4 py-2 rounded font-bold transition"><i class="fas fa-sync-alt mr-2"></i> Başka Fikir</button>
                    </div>
                </div>
            `;

            document.getElementById('emergency-intro').classList.add('hidden');
            document.getElementById('emergency-display').innerHTML = html;
            document.getElementById('emergency-display').classList.remove('hidden');
        }

        // Initialize last state from local storage if needed, or set defaults
        window.onload = () => {
            const savedTopic = localStorage.getItem('tymm_last_topic');
            const savedDuration = localStorage.getItem('tymm_last_duration');
            if(savedTopic) document.getElementById('plan-topic').value = savedTopic;
            if(savedDuration) document.getElementById('plan-duration').value = savedDuration;
        }

    </script>
</body>
</html>
